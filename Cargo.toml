[package]
name = "plasma_warp"
version = "0.1.0"
edition = "2021"
description = "plasma_warp: a scene-based, music-synced demo (Rotozoom, MenInBlack, CyberPuzzle)"
readme = "README.md"
license = "MIT"

[[bin]]
name = "plasma_warp"
path = "src/main.rs"

[features]
# Default = the actual demo: realtime SDL3 window + music playback.
# `--no-default-features` builds the headless PNG frame dumper (no SDL needed).
default = ["realtime"]
realtime = ["dep:sdl3"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# Per-frame arena allocation (bumpalo `collections` gives bump-allocated Vec).
bumpalo = { version = "3", features = ["collections"] }
# Fixed-capacity, zero-heap arrays (clip output, quad corners).
arrayvec = "0.7"
# SDL3 + SDL3_mixer (the `mixer` feature links system SDL3_mixer).
sdl3 = { version = "0.20", optional = true, features = ["mixer"] }

# Project lint policy: silence ALL rustc warnings for this package. We keep the
# codebase warning-free intentionally (dead_code helpers kept for experimentation,
# the *_ENABLED glitch flags, etc.), and the project rule is a clean build.
[lints.rust]
warnings = "allow"

[profile.release]
opt-level = 3
lto = "thin"
