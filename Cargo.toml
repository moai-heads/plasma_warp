[package]
name = "plasma_warp"
version = "0.1.0"
edition = "2021"
description = "plasma_warp: a scene-based, music-synced demo (Rotozoom, TriangleDance, CyberPuzzle)"
readme = "README.md"
license = "MIT"

[[bin]]
name = "plasma_warp"
path = "src/main.rs"

[features]
# Default = the actual demo: realtime SDL3 window + music playback.
# `--no-default-features` builds the headless PNG frame dumper (no SDL needed).
default = ["realtime"]
realtime = ["dep:sdl3", "dep:lewton"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
sdl3 = { version = "0.20", optional = true }
lewton = { version = "0.10", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
